[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Tokahiro/kidou-plugins"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
# Pedantic lints that cost more readability than they buy in this code base.
doc_markdown = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Kidō builds Slint from the fork Tokahiro/slint, at one fixed commit, and compiles a Home
# layout with that build. Slint's crates pin each other to one exact version, so each of them
# the layout check uses is named here. Kidō's own build names the same commit: change both
# together.
[patch.crates-io]
i-slint-core = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
i-slint-core-macros = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
i-slint-common = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
i-slint-compiler = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
slint-interpreter = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
i-slint-backend-selector = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
vtable = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
vtable-macro = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
const-field-offset = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
const-field-offset-macro = { git = "https://github.com/Tokahiro/slint", rev = "111cd0478bd0cffbc4c00c3344eb1ed3ae657458" }
