[package]
name = "kidou-layout"
description = """
Home layouts by others: a layout package's files read into memory and hashed, the check that
installs it, and Slint's interpreter that compiles it from that copy only."""
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.kidou]
# Kidō's build checks this crate's dependencies by this name.
ring = "layout"

[dependencies]
# The check walks the layout as Slint's compiler builds it; `compile` builds it with the
# interpreter that Home embeds. `internal` holds the hooks that keep every read in memory.
i-slint-compiler = { version = "=1.19.0", default-features = false }
# `svg`: Slint's SVG reader draws a layout's SVG once, as a PNG (`png`).
i-slint-core = { version = "=1.19.0", default-features = false, features = ["svg"] }
png = "0.18"
# The elements and links of a layout's SVG, checked before Slint's SVG reader opens it.
roxmltree = "0.21"
base64 = "0.22"
slint-interpreter = { version = "=1.19.0", default-features = false, features = ["compat-1-18", "internal"] }
sha2 = "0.11"
# The addresses of the layout's files, which Slint's compiler and resource mapper take.
url = "2.5"
