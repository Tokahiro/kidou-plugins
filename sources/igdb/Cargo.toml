[package]
name = "kidou-plugin-igdb"
description = """
IGDB as a source plugin: a game's time to beat, asked with the player's own Twitch \
credentials; for wasm32-wasip2."""
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }

[lints]
workspace = true
