[package]
name = "kidou-plugin-onexconsole"
description = """
OneXConsole as a device plugin, read only: its presets and the programs they are bound to, and a \
tile that opens it; for wasm32-wasip2."""
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }

[lints]
workspace = true
