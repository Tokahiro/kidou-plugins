name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Kidō holds a package to the SHA-256 it was listed with, so a listed file stays as it is.
      - name: No listed package changes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "$BASE"...HEAD -- packages | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            printf 'A package never changes once listed; a new version gets a new file:\n%s\n' "$changed"
            exit 1
          fi
      - run: cargo test --locked
      - run: cargo xtask check

  # Packs each plugin whose source has a new version, and lists the package.
  pack:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency: pack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pack new versions
        run: |
          packed=$(cargo xtask pack)
          if [ -z "$packed" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.toml packages
          git commit -m "Pack $(printf '%s' "$packed" | paste -sd, - | sed 's/,/, /g')"
          git push
