name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Kidō holds a package to the SHA-256 it was listed with, so a listed file stays as it is.
      - name: No listed package changes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "$BASE"...HEAD -- packages | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            printf 'A package never changes once listed; a new version gets a new file:\n%s\n' "$changed"
            exit 1
          fi
      # Slint's font code links fontconfig, whose development files the image does not have.
      - name: Linux packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libfontconfig-dev pkgconf
      # Slint's compiler, which the layout check builds, takes minutes without it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: slint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo xtask check

  # Packs each plugin whose source has a new version. It packs main as it is now, so a run that
  # waited packs what the runs before it left. This job runs cargo and cannot write.
  pack:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: pack
    outputs:
      packed: ${{ steps.pack.outputs.packed }}
      commit: ${{ steps.pack.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Linux packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libfontconfig-dev pkgconf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: slint
          save-if: false
      - id: pack
        name: Pack new versions
        run: |
          cargo xtask check
          packed=$(cargo xtask pack)
          echo "packed=$(printf '%s' "$packed" | paste -sd, - | sed 's/,/, /g')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.pack.outputs.packed != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed
          path: |
            index.toml
            packages/
          retention-days: 1

  # Lists what the pack job wrote, on the commit it packed: this job can write and runs no
  # code of the repository. Where main moved meanwhile, its push fails and the next run packs.
  list:
    if: needs.pack.outputs.packed != ''
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pack.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed
      - env:
          PACKED: ${{ needs.pack.outputs.packed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.toml packages
          git commit -m "Pack $PACKED"
          git push origin HEAD:main
